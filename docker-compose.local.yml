services:
  nginx:
    image: nginx:alpine
    ports:
      - "8123:443"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build: .
    env_file:
      - .env
    volumes:
      - ./certs/local/KONA-PROXY.pem:/certs/KONA-PROXY.pem:ro
      - ./logs:/app/logs
    environment:
      - CORS_ORIGIN=https://localhost:8123
      - EXTRA_CA_CERT=/certs/KONA-PROXY.pem
      - LOG_DIR=/app/logs
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      - AGENT_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
