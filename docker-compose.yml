services:
  nginx:
    image: nginx:alpine
    ports:
      - "8123:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build: .
    env_file:
      - .env
    environment:
      - CORS_ORIGIN=https://phantom-agent.duckdns.org:8123
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      - AGENT_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
