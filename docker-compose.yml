services:
  backend:
    build: .
    ports:
      - "8123:8123"
    env_file:
      - .env
    environment:
      - CORS_ORIGIN=http://localhost:3000
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - AGENT_URL=http://backend:8123
    depends_on:
      - backend
    restart: unless-stopped
