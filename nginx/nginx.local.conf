server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/letsencrypt/local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/local/privkey.pem;

    location /api/teams/ {
        proxy_pass http://backend:8000/api/teams/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
